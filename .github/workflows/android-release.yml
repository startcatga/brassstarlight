name: Android Release Build

# Builds a signed release APK and AAB on every push and on demand.
# The keystore never lives in the repo — it is decoded at runtime from a
# base64 GitHub Secret and deleted before the job ends. Secrets are passed via
# the environment only and are never printed to the logs.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the game is tested with locally. Bump it on
          # purpose (and update android/ Gradle settings to match the new
          # Flutter template) rather than letting "latest" break the build.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Decode keystore from secret
        env:
          STARCART_KEYSTORE_BASE64: ${{ secrets.STARCART_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STARCART_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret STARCART_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$STARCART_KEYSTORE_BASE64" | base64 --decode > android/app/starcart-upload.jks

      - name: Create key.properties
        env:
          STARCART_STORE_PASSWORD: ${{ secrets.STARCART_STORE_PASSWORD }}
          STARCART_KEY_ALIAS: ${{ secrets.STARCART_KEY_ALIAS }}
          STARCART_KEY_PASSWORD: ${{ secrets.STARCART_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=starcart-upload.jks"
            echo "storePassword=${STARCART_STORE_PASSWORD}"
            echo "keyAlias=${STARCART_KEY_ALIAS}"
            echo "keyPassword=${STARCART_KEY_PASSWORD}"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release signing (never debug)
        run: |
          for f in build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk; do
            if keytool -printcert -jarfile "$f" | grep -q "CN=Android Debug"; then
              echo "::error::$f is signed with the debug key."
              exit 1
            fi
          done
          echo "Release artifacts are signed with the upload key."

      - name: Remove signing material
        if: always()
        run: rm -f android/app/starcart-upload.jks android/key.properties

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: brass-and-starlight-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: brass-and-starlight-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
